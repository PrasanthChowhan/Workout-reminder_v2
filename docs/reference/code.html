<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Active Recall Session</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for typography matching -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@400;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'app-bg': '#1e2126',
            'card-bg': '#26292f',
            'brand-orange': '#ff7a45',
            'off-white': '#e8e6e3',
            'text-muted': '#a0a0a0',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      background-color: #1e2126;
      color: #e8e6e3;
    }
    /* Simple decoration for the arc in the background */
    .bg-arc {
      position: absolute;
      top: 15%;
      right: 5%;
      width: 150px;
      height: 150px;
      border: 8px solid #ff7a45;
      border-radius: 50%;
      clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%);
      z-index: 0;
      opacity: 0.8;
      transform: rotate(45deg);
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col items-center justify-center p-8 overflow-hidden relative">
<!-- Background Decorative Element -->
<div class="bg-arc"></div>
<!-- BEGIN: TopHeader -->
<header class="w-full max-w-6xl flex justify-center items-center relative mb-12" data-purpose="top-navigation">
<h1 class="text-9xl font-bold font-display tracking-tight text-off-white select-none">
      03:00
    </h1>
<!-- Settings Icon -->
<button class="absolute right-0 top-0 text-text-muted hover:text-brand-orange transition-colors" data-purpose="settings-trigger">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: ContentContainer -->
<main class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-12 gap-8 z-10" data-purpose="main-cards-layout">
<!-- Left Card: Physical Reset -->
<section class="md:col-span-4 bg-card-bg rounded-[3rem] p-4 flex flex-col border border-white/5 shadow-2xl" data-purpose="side-card">
<div class="relative w-full aspect-square mb-6">
<!-- Image Container -->
<div class="rounded-[2.5rem] overflow-hidden w-full h-full">
<img alt="Physical Reset Visual" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSP8ayYz8e6S4ObUs1uRNgHu5sZYSPPvwLt9vnm-bHqWlnZgnesLBve65puWHeWFesdANeGDFIbwSdsDTh_7WHRSqCroYDIhN2lLDh2XgAR6kUP4hdiqc-FRVaTQfHK2rrcH_tQodqwbCZTwh8ViS1HY3WWroP3djtu6S5c3h2xcp_lPfvFaa5U0dMOtId93Dits67UWE4cOOuZjHwFc9x9tJ07bs0mgQhYnbm931-l4sF9bDNG2Jhcw"/>
<!-- The image in original is actually a slice of the overall image, here used as placeholder -->
</div>
<!-- Time Badge -->
<div class="absolute top-6 left-6 px-4 py-1.5 bg-black/40 backdrop-blur-md border border-white/20 rounded-full text-[10px] font-bold tracking-widest text-white uppercase">
          30 Second
        </div>
</div>
<div class="px-4 pb-4 flex-grow">
<h2 class="text-2xl font-bold mb-2">Physical Reset</h2>
<p class="text-sm text-text-muted leading-relaxed mb-8">
          Quick desk-side mobility routine to realign posture and improve blood flow.
        </p>
</div>
<!-- Footer Actions -->
<div class="px-4 py-6 border-t border-white/10 flex items-center justify-between">
<div class="flex gap-4">
<button class="flex items-center gap-1.5 text-[10px] font-bold tracking-widest text-text-muted hover:text-white transition-colors uppercase">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
            Watch
          </button>
<button class="flex items-center gap-1.5 text-[10px] font-bold tracking-widest text-text-muted hover:text-white transition-colors uppercase">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M12 16v-4"></path><path d="M12 8h.01"></path><circle cx="12" cy="12" r="10"></circle></svg>
            Details
          </button>
</div>
<button class="text-text-muted hover:text-white transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="m15 3 6 6M9 21l-6-6M21 3l-6 6M3 21l6-6"></path></svg>
</button>
</div>
</section>
<!-- Right Card: Active Recall Session -->
<section class="md:col-span-8 bg-card-bg rounded-[3.5rem] p-12 flex flex-col justify-between border border-white/5 shadow-2xl relative" data-purpose="primary-session-card">
<!-- Top Section -->
<div>
<div class="flex justify-between items-start mb-6">
<span class="text-[10px] font-bold tracking-[0.2em] text-text-muted uppercase">Active Recall Session</span>
<button class="text-text-muted hover:text-brand-orange transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
</button>
</div>
<h2 class="text-6xl font-bold font-display mb-10 leading-tight max-w-2xl">
          What is a Lifetime in Rust?
        </h2>
<p class="text-xl text-text-muted leading-relaxed max-w-2xl">
          A lifetime is a construct the compiler uses to ensure all borrows are valid and that data isn't dropped while it's still being used.
        </p>
</div>
<!-- Action Footer -->
<div class="mt-20 flex justify-between items-center">
<button class="flex items-center gap-2 px-6 py-3 border border-white/20 rounded-2xl text-sm font-medium hover:bg-white/5 transition-colors" data-purpose="source-link">
          View Source
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" x2="21" y1="14" y2="3"></line></svg>
</button>
<button class="flex items-center gap-3 px-10 py-4 bg-brand-orange text-black font-bold rounded-[1.5rem] text-sm tracking-widest hover:brightness-110 transition-all uppercase" data-purpose="primary-action">
          Show Answer
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3" viewbox="0 0 24 24"><line x1="5" x2="19" y1="12" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
</button>
</div>
</section>
</main>
<!-- END: ContentContainer -->
<!-- BEGIN: BottomActions -->
<footer class="mt-12 flex gap-4" data-purpose="bottom-bar">
<button class="px-8 py-4 border border-white/10 bg-white/5 rounded-full text-[10px] font-bold tracking-widest text-text-muted hover:bg-white/10 transition-all uppercase">
      Didn't Do
    </button>
<button class="px-8 py-4 bg-brand-orange text-black rounded-full flex items-center gap-3 text-[10px] font-bold tracking-widest hover:brightness-110 transition-all uppercase">
      Done Session
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
</button>
</footer>
<!-- END: BottomActions -->
</body></html>
